<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hithesh B — personal portfolio">
  <title>Hithesh B | Portfolio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #eaf2f5;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top right, #174d49, transparent 42%), #0b1220;
    }
    main {
      width: min(760px, 100%); padding: 48px 36px; text-align: center;
      border: 1px solid #29434a; border-radius: 24px;
      background: rgba(17, 31, 43, .88); box-shadow: 0 24px 70px #0006;
    }
    .eyebrow { color: #69dfb1; letter-spacing: .16em; text-transform: uppercase; font-size: .8rem; }
    h1 { margin: 14px 0; font-size: clamp(2.5rem, 8vw, 4.5rem); }
    p { color: #b9cbd1; line-height: 1.7; font-size: 1.08rem; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 30px; }
    a {
      color: #071b18; background: #69dfb1; text-decoration: none; font-weight: 700;
      padding: 12px 19px; border-radius: 999px;
    }
    a.secondary { color: #eaf2f5; background: transparent; border: 1px solid #527078; }
    footer { margin-top: 38px; color: #8299a1; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Personal Portfolio</div>
    <h1>Hi, I'm Hithesh B</h1>
    <p>Welcome to my portfolio. I'm building this space to showcase my projects, skills, and work. Please check back soon for updates.</p>
    <nav>
      <a href="https://github.com/Hithesh55" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="secondary" href="https://www.linkedin.com/in/hithesh-b-14b221280/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </nav>
    <footer>© <span id="year"></span> Hithesh B</footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
